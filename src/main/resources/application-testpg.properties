# ============================================
# PostgreSQL Test Profile — Local Development
# Run with: ./mvnw spring-boot:run -Dspring.profiles.active=testpg
# ============================================

# PostgreSQL connection (Homebrew PG 16 on port 5433)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/ashokadb
spring.datasource.username=sarthakjain
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Hibernate create/update the schema automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

# Suppress the HikariCP warning about driver class name
spring.datasource.initialization-mode=always
